[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agentic-systems-core"
version = "0.1.0"
description = "Curso genérico de IA, Machine Learning y Sistemas Multi-Agente — UCEMICH"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ljyudico" }]
dependencies = [
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.4.0",
    "google-genai>=1.0.0",
    "nbformat>=5.10.0",
    "pypdf>=5.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "dspy>=2.5.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "google-adk>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
practica-u3 = [
    "langchain==0.3.25",
    "langchain-community==0.3.24",
    "langchain-core==0.3.59",
    "langgraph==0.2.56",
    "langgraph-checkpoint-sqlite==2.0.6",
    "crewai==0.80.0",
    "litellm==1.68.0",
    "google-adk==1.0.0",
    "smolagents==1.24.0",
    "ddgs==9.12.0",
    "langchain-openai==0.3.14",
    "langchain-anthropic==0.3.12",
    "langchain-google-genai==2.0.10",
    "openai==1.68.2",
    "anthropic==0.49.0",
    "google-generativeai==0.8.5",
    "langchain-ollama==0.3.2",
    "ollama==0.4.8",
    "chromadb==0.6.3",
    "sentence-transformers==3.4.1",
    "mem0ai==0.1.103",
    "langsmith==0.3.15",
    "fastapi==0.115.11",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "mcp==1.28.1",
    "pydantic==2.11.1",
    "python-dotenv==1.1.0",
    "tenacity==8.5.0",
    "pillow==11.1.0",
    "pygithub==2.6.1",
    "tiktoken==0.9.0",
    "diskcache==5.6.3",
    "llmlingua==0.2.2",
    "neo4j==5.28.1",
    "kuzu==0.7.1",
    "networkx==3.4.2",
    "pyvis==0.3.2",
    "graphiti-core==0.3.18",
    "graphrag==2.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "multiagent_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
